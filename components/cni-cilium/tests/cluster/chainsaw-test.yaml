# Read-only assertions on a running cluster where Cilium replaces
# kube-proxy on the netkit datapath. The namespace is set so chainsaw uses
# kube-system instead of creating one.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cni-cilium
  labels:
    component: cni-cilium
spec:
  namespace: kube-system
  steps:
    - name: Cilium replaces kube-proxy on the netkit datapath
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cilium-config
              data:
                kube-proxy-replacement: "true"
                datapath-mode: netkit
