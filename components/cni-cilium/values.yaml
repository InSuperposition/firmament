# Cilium chart values, shared by the bootstrap and Flux. Both substitute the
# variables below from the flux-runtime-info ConfigMap, which OpenTofu
# computes, so this file holds no conditionals.

# Pins what Cilium defaults to for new installs to the version first
# installed, so a chart upgrade keeps the running configuration. Change it
# only through an explicitly tested migration.
upgradeCompatibility: "1.20"
# netkit requires kube-proxy replacement and BPF masquerading; the agent refuses to start without both.
bpf:
  datapathMode: ${cilium_datapath_mode}
  masquerade: ${kube_proxy_replacement}
kubeProxyReplacement: ${kube_proxy_replacement}
# Pod traffic to Services is translated per packet, not per socket, so a pod's connected
# UDP socket follows a replaced backend on kernels that cannot destroy sockets.
socketLB:
  hostNamespaceOnly: true
k8sServiceHost: "${api_address}"
k8sServicePort: ${api_port}
# Pod IPs come from the podCIDR Kubernetes assigns to each node.
ipam:
  mode: kubernetes
# Restart pods when their configuration changes, so a values change takes effect on apply.
rollOutCiliumPods: true
image:
  useDigest: true
# The L7 proxy runs in its own DaemonSet, so restarting the agent alone
# keeps L7 traffic flowing.
envoy:
  enabled: true
  rollOutPods: true
  image:
    useDigest: true
operator:
  replicas: ${cilium_operator_replicas}
  rollOutPods: true
  image:
    useDigest: true
certgen:
  image:
    useDigest: true
hubble:
  relay:
    enabled: true
    rollOutPods: true
    image:
      useDigest: true
  ui:
    enabled: true
    rollOutPods: true
    backend:
      image:
        useDigest: true
    frontend:
      image:
        useDigest: true
  # A CronJob renews the Hubble mTLS certificates before their one-year validity ends.
  tls:
    auto:
      method: cronJob
# Marks the agent pods with the change that rolled them out.
podAnnotations:
  firmament.dev/rollout: flux-upgrade-proof
