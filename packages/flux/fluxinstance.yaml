# Flux itself, installed from the manifests embedded in the Flux Operator
# image, and the sync that points Flux at this repository. ${git_branch} and
# ${cluster} come from the flux-runtime-info ConfigMap: the bootstrap
# substitutes them once, and the root Kustomization on every reconcile.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    # Removing Flux takes an explicit teardown, never a Git deletion.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: 2.9.5
    registry: ghcr.io/fluxcd
  # Flux Operator owns the flux-system Namespace and marks it so
  # kustomize-controller skips it, which leaves the rendered namespaces unable
  # to label it. It stamps these labels on the Namespace and on the Flux
  # objects instead, the same ones every tenant namespace carries. The tenant
  # is the one the cluster's binding for flux names; the cluster suite
  # asserts the label, so a drift fails there.
  commonMetadata:
    labels:
      firmament.dev/tenant: platform
      firmament.dev/environment: ${environment}
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  sync:
    kind: GitRepository
    url: https://github.com/InSuperposition/firmament.git
    ref: refs/heads/${git_branch}
    path: clusters/${cluster}/flux
  kustomize:
    patches:
      - target:
          kind: Kustomization
          name: flux-system
        patch: |
          - op: add
            path: /spec/postBuild
            value:
              substituteFrom:
                - kind: ConfigMap
                  name: flux-runtime-info
