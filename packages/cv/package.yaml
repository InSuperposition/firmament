name: cv
layer: app
pin:
  source: oci://ghcr.io/insuperposition/charts/cv
  version: 0.1.1
  digest: sha256:e2e23ef16404303b2c0bd230e877ddef4d85028235001c3e27fc71460323b15d
# Flux installs the chart only when it carries a keyless cosign signature from
# the cv repository's publish workflow on a release tag.
verify:
  issuer: ^https://token\.actions\.githubusercontent\.com$
  identity: ^https://github\.com/InSuperposition/cv/\.github/workflows/publish\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$
# The pod port the node's probes reach.
host_ports:
  - port: 44100
    protocol: TCP
# The same pod port, reached by the platform Gateway.
ingress_ports:
  - port: 44100
    protocol: TCP
