# Cilium, the cluster network. The OpenTofu bootstrap installs it once,
# before any pod network exists; from then on Flux upgrades it from these
# manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ocirepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: cilium-values
    namespace: flux-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  # A change to the values triggers a HelmRelease upgrade.
  labels:
    reconcile.fluxcd.io/watch: Enabled
