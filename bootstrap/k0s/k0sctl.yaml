apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: firmament
  user: admin
spec:
  hosts:
    - ssh:
        address: ""
        user: ""
        port: 22
        keyPath: ""
      role: controller+worker
      noTaints: true
  k0s:
    version: 1.36.4+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: firmament
      spec:
        api:
          externalAddress: ""
        network:
          provider: custom
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
          kubeProxy:
            disabled: true
  options:
    wait:
      enabled: true
    drain:
      enabled: false
    concurrency:
      limit: 1
      uploads: 1
