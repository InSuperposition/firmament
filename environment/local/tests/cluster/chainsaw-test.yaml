# Read-only assertions on a running local cluster. Run with
# --set kubeProxyReplacement=<true|false>, the mode recorded in state.
# The namespace is set so chainsaw uses kube-system instead of creating one.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster
spec:
  namespace: kube-system
  steps:
    - name: every node is ready
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Node
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
        - error:
            resource:
              apiVersion: v1
              kind: Node
              status:
                (conditions[?type == 'Ready'] | [0].status != 'True'): true
    - name: kube-proxy runs only when Cilium does not replace it
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: kube-system
              (x_k8s_exists($client, 'apps/v1', 'DaemonSet', 'kube-system', 'kube-proxy')): ($values.kubeProxyReplacement == `false`)
    - name: Cilium runs the datapath for the kube-proxy mode
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cilium-config
              data:
                kube-proxy-replacement: (to_string($values.kubeProxyReplacement))
                # netkit with kube-proxy replacement, veth without it.
                datapath-mode: (($values.kubeProxyReplacement && 'netkit') || 'veth')
