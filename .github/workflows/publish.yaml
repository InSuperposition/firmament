# Publishes the cluster definition as a signed OCI artifact: every pushed
# commit becomes ghcr.io/insuperposition/firmament:<commit>, signed keyless
# with this workflow's identity. Flux verifies that identity before it
# applies the artifact.
name: publish

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT: ghcr.io/insuperposition/firmament:${{ github.sha }}
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked flux2 cosign
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: flux push artifact "oci://$ARTIFACT" --path . --ignore-paths '/*,!/clusters/,!/packages/' --reproducible --source "${{ github.server_url }}/${{ github.repository }}" --revision "sha1:${{ github.sha }}"
      - run: cosign sign --yes "$ARTIFACT"
      - run: cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/InSuperposition/firmament/\.github/workflows/publish\.yaml@refs/heads/.+$' "$ARTIFACT"
