# Lets the Gateway's Envoy reach the cv pod; the rendered policy of cv allows
# only the node's probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gateway-ingress
  namespace: cv
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "44100"
              protocol: TCP
