# The cv site: every request on the platform Gateway goes to the cv Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cv
  namespace: cv
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: http
  rules:
    - backendRefs:
        - name: cv
          port: 80
