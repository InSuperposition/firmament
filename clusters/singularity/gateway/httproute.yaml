# The cv site: every request on the platform Gateway goes to the cv Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cv
  namespace: cv
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  parentRefs:
    - name: platform
      namespace: kube-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cv
          port: 80
