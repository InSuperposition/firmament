apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - httproute.yaml
configMapGenerator:
  - name: cilium-values-gateway
    namespace: flux-system
    files:
      - values.yaml=cilium-values-gateway.yaml
generatorOptions:
  disableNameSuffixHash: true
  # A change to the values triggers a HelmRelease upgrade.
  labels:
    reconcile.fluxcd.io/watch: Enabled
