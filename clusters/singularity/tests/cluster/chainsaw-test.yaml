# Read-only assertions on this cluster itself: its nodes, the signed artifact
# Flux applies, and what k0s must leave to Flux. Each package checks its own
# workloads in packages/<name>/tests/cluster. The namespace is set so
# chainsaw uses kube-system instead of creating one.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster
spec:
  namespace: kube-system
  steps:
    - name: every node is ready
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Node
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
        - error:
            resource:
              apiVersion: v1
              kind: Node
              status:
                (conditions[?type == 'Ready'] | [0].status != 'True'): true
    - name: kube-proxy does not run
      try:
        - error:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: kube-proxy
    - name: k0s installs no Helm charts
      try:
        - error:
            resource:
              apiVersion: helm.k0sproject.io/v1beta1
              kind: Chart
    - name: Flux applies only the verified artifact of the pinned commit
      # CI may still be publishing the tag, so the source gets as long as the
      # root Kustomization does.
      timeouts:
        assert: 10m
      try:
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata:
                name: payload
                namespace: flux-system
              status:
                (conditions[?type == 'SourceVerified'] | [0].status): "True"
                (starts_with(artifact.revision || '', join('', [$values.git_commit, '@sha256:']))): true
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: payload
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (starts_with(lastAppliedRevision || '', join('', [$values.git_commit, '@sha256:']))): true
    - name: Flux applies the namespaces rendered from the bindings
      timeouts:
        assert: 10m
      try:
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: rendered
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (starts_with(lastAppliedRevision || '', join('', [$values.git_commit, '@sha256:']))): true
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: flux-system
                labels:
                  firmament.dev/tenant: platform
        - assert:
            resource:
              apiVersion: v1
              kind: ResourceQuota
              metadata:
                name: tenant
                namespace: flux-system
    - name: The network policies are valid and the node's access to pods is closed
      # The Cilium release upgrades after the policies that keep the node's
      # probes working exist, so its setting arrives after them.
      timeouts:
        assert: 10m
      try:
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: platform
                namespace: cert-manager
              status:
                (conditions[?type == 'Valid'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: platform
                namespace: openbao
              status:
                (conditions[?type == 'Valid'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: platform
                namespace: kube-system
              status:
                (conditions[?type == 'Valid'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: platform
                namespace: flux-system
              status:
                (conditions[?type == 'Valid'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cilium-config
                namespace: kube-system
              data:
                allow-localhost: policy
    - name: The apps tenant owns the cv namespace, which is denied by default
      # The namespace exists because a binding declares it; the clusterwide
      # policy denies every namespace the platform tenant does not own, and
      # the namespace's own policy allows the node's probes.
      timeouts:
        assert: 10m
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cv
                labels:
                  firmament.dev/tenant: apps
        - assert:
            resource:
              apiVersion: v1
              kind: ResourceQuota
              metadata:
                name: tenant
                namespace: cv
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumClusterwideNetworkPolicy
              metadata:
                name: tenant-default-deny
              status:
                (conditions[?type == 'Valid'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: platform
                namespace: cv
              status:
                (conditions[?type == 'Valid'] | [0].status): "True"
    - name: cert-manager issues from OpenBao
      # env:apply creates openbao-root after OpenBao is Ready; the Issuer
      # logs in with cert-manager's service account and trusts that root.
      timeouts:
        assert: 10m
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: openbao-root
                namespace: cert-manager
        - assert:
            resource:
              apiVersion: cert-manager.io/v1
              kind: Issuer
              metadata:
                name: openbao
                namespace: cert-manager
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: issuer-probe
                namespace: cert-manager
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
