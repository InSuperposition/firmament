# Read-only assertions on this cluster itself: its nodes, the signed artifact
# Flux applies, and what k0s must leave to Flux. Each package checks its own
# workloads in packages/<name>/tests/cluster. The namespace is set so
# chainsaw uses kube-system instead of creating one.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster
spec:
  namespace: kube-system
  steps:
    - name: every node is ready
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Node
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
        - error:
            resource:
              apiVersion: v1
              kind: Node
              status:
                (conditions[?type == 'Ready'] | [0].status != 'True'): true
    - name: kube-proxy does not run
      try:
        - error:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: kube-proxy
    - name: k0s installs no Helm charts
      try:
        - error:
            resource:
              apiVersion: helm.k0sproject.io/v1beta1
              kind: Chart
    - name: Flux applies only the verified artifact of the pinned commit
      # CI may still be publishing the tag, so the source gets as long as the
      # root Kustomization does.
      timeouts:
        assert: 10m
      try:
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata:
                name: payload
                namespace: flux-system
              status:
                (conditions[?type == 'SourceVerified'] | [0].status): "True"
                (starts_with(artifact.revision || '', join('', [$values.git_commit, '@sha256:']))): true
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: payload
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (starts_with(lastAppliedRevision || '', join('', [$values.git_commit, '@sha256:']))): true
    - name: Flux applies the namespaces rendered from the bindings
      timeouts:
        assert: 10m
      try:
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: rendered
                namespace: flux-system
              status:
                (conditions[?type == 'Ready'] | [0].status): "True"
                (starts_with(lastAppliedRevision || '', join('', [$values.git_commit, '@sha256:']))): true
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: flux-system
                labels:
                  firmament.dev/tenant: platform
        - assert:
            resource:
              apiVersion: v1
              kind: ResourceQuota
              metadata:
                name: tenant
                namespace: flux-system
