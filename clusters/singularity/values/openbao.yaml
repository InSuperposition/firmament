# The OpenBao chart's values on this cluster. What must agree with the server
# config (the server config itself, the volumes and mounts, the init
# container, the TLS port and the host alias) is generated by
# packages/openbao/config from clusters/<cluster>/openbao.yaml; setting one of
# those keys here is refused.
global:
  # The chart's own probes and BAO_ADDR use the plain loopback listener.
  tlsDisable: true
injector:
  enabled: false
server:
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
  dataStorage:
    enabled: false
  auditStorage:
    enabled: false
  service:
    port: 8200
