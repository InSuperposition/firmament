# Applies the Issuer that signs with OpenBao. It waits for the rendered
# Kustomization, whose cert-manager release brings the CRDs, and lists no
# healthChecks: the Issuer stays NotReady until env:apply has created
# openbao-root, and that must not hold anything back.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: issuers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  dependsOn:
    - name: rendered
  sourceRef:
    kind: OCIRepository
    name: payload
  path: ./clusters/singularity/issuers
