# Applies the Gateway and the routes, and the values that switch Cilium's
# Gateway controller on. It waits for the definitions, and for the rendered
# Kustomization, whose namespaces hold the routes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  dependsOn:
    - name: gateway-api-crds
    - name: rendered
  sourceRef:
    kind: OCIRepository
    name: payload
  path: ./clusters/singularity/gateway
