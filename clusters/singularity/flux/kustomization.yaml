# What Flux reads from Git in every environment that runs this cluster: the
# signed artifact of the pinned commit, and the Kustomization that applies it.
# The packages are in the artifact, under clusters/singularity/payload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ocirepository.yaml
  - payload.yaml
  - rendered.yaml
  - issuers.yaml
  - gateway-api-crds.yaml
