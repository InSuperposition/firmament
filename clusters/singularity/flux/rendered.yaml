# Applies what CI rendered for this environment: the namespaces, with their
# tenant labels and quotas. The artifact holds one folder per environment;
# ${environment} comes from the flux-runtime-info ConfigMap. Namespaces carry
# prune: disabled, so removing a binding never deletes a namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rendered
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  # Ready once the releases whose CRDs others wait for are Ready. OpenBao
  # is not listed: a sealed or failing OpenBao must not hold the namespaces
  # and cert-manager back; the cluster suite checks it.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: flux-system
  sourceRef:
    kind: OCIRepository
    name: payload
  path: ./clusters/singularity/rendered/${environment}
