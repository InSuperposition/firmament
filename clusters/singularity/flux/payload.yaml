# Applies the verified artifact: the packages under clusters/singularity/payload.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payload
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  sourceRef:
    kind: OCIRepository
    name: payload
  path: ./clusters/singularity/payload
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: flux-operator
      namespace: flux-system
