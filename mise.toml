min_version = "2026.10.0"

[settings]
lockfile = true

[hooks]
postinstall = "mise run repo:setup"

[env]
FIRMAMENT_STATE_HOME = "{% if env.FIRMAMENT_STATE_HOME %}{{ env.FIRMAMENT_STATE_HOME }}{% elif env.XDG_STATE_HOME %}{{ env.XDG_STATE_HOME }}/firmament{% else %}{{ env.HOME }}/.local/state/firmament{% endif %}"
# Every OpenTofu run, task or test shares one provider cache, so init makes
# no registry call once a provider is cached.
TF_PLUGIN_CACHE_DIR = "{% if env.XDG_CACHE_HOME %}{{ env.XDG_CACHE_HOME }}{% else %}{{ env.HOME }}/.cache{% endif %}/firmament/tofu-plugins"
# MISE_ENV names the environment (local when unset). Everything an
# environment owns on this machine is derived from it here, once: the state
# folder, which every OpenTofu root reads as var.state_directory, and the
# cluster's kubeconfig inside it.
TF_VAR_state_directory = "{{ env.FIRMAMENT_STATE_HOME }}/environments/{{ get_env(name='MISE_ENV', default='local') }}"
KUBECONFIG = "{{ env.TF_VAR_state_directory }}/admin.kubeconfig"

[tools]
"aqua:kyverno/chainsaw" = { version = "0.2.15", slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0", slsa_signer_issuer = "https://token.actions.githubusercontent.com" }
bats = "1.14.0"
betterleaks = "1.9.0"
cilium-cli = "0.20.1"
cilium-hubble = "1.19.4"
cue = "0.17.1"
flux2 = { version = "2.9.5", slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0", slsa_signer_issuer = "https://token.actions.githubusercontent.com" }
"github:fluxcd/flux-schema" = "0.13.0"
helm = "4.3.0"
hk = "2.0.1"
jq = "1.8.2"
k0sctl = "0.33.1"
kubectl = "1.36.4"
opentofu = "1.12.6"
shellcheck = "0.11.0"
shfmt = "3.14.1"
timoni = "0.35.0"
yq = "4.53.6"

[tasks.check]
description = "Run every offline check: lint, validate and test"
run = [{ task = "lint" }, { task = "tofu:validate" }, { task = "test" }]

[tasks.format]
description = "Run every *:format task"
depends = ["*:format"]

[tasks."k0s:test"]
description = "Check that the orch-k0s module requires its inputs, without a live host"
run = "bats modules/orch-k0s/tests/inputs.bats"

[tasks.lint]
description = "Run every *:lint task; changes nothing"
depends = ["*:lint"]

[tasks."mise:format"]
description = "Format mise.toml"
run = "hk fix --all --step mise"

[tasks."mise:lint"]
description = "Check mise.toml formatting and validate every task definition"
run = ["hk check --all --step mise", "mise tasks validate"]

[tasks."orb:test"]
description = "Test the vm-orb module without a live VM"
run = "bats modules/vm-orb/tests/unit.bats"

[tasks."secrets:lint"]
description = "Scan every file in the repository for secrets with betterleaks"
run = "hk check --all --step betterleaks"

[tasks."shell:format"]
description = "Format every shell script and bats file with shfmt"
run = "hk fix --all --step shfmt"

[tasks."shell:lint"]
description = "Lint every shell script with shellcheck and check its shfmt formatting"
run = "hk check --all --step shellcheck --step shfmt"

[tasks."tasks:test"]
description = "Test the task scripts and their shared library with stubbed tools"
run = "bats .mise/tests"

[tasks.test]
description = "Run every *:test task; never touches infrastructure"
depends = ["*:test"]

[tasks."tofu:format"]
description = "Format every OpenTofu file"
run = "hk fix --all --step tofu"

[tasks."tofu:lint"]
description = "Check the formatting of every OpenTofu file"
run = "hk check --all --step tofu"

[tasks."ubuntu:test"]
description = "Test the os-ubuntu module without a live host"
run = "bats modules/os-ubuntu/tests/unit.bats"
