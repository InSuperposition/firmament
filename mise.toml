[settings]
lockfile = true

[hooks]
postinstall = "mise run repo:setup"

[env]
FIRMAMENT_STATE_HOME = "{% if env.FIRMAMENT_STATE_HOME %}{{ env.FIRMAMENT_STATE_HOME }}{% elif env.XDG_STATE_HOME %}{{ env.XDG_STATE_HOME }}/firmament{% else %}{{ env.HOME }}/.local/state/firmament{% endif %}"
# Default cluster at the repository root; each environment/<env>/mise.toml
# points KUBECONFIG at its own cluster.
KUBECONFIG = "{{ env.FIRMAMENT_STATE_HOME }}/environment/local/admin.kubeconfig"

[tools]
bats = "1.14.0"
cilium-cli = "0.20.0"
cilium-hubble = "1.19.4"
hk = "2.0.1"
jq = "1.8.2"
kubectl = "1.36.4"
opentofu = "1.12.6"
shellcheck = "0.11.0"
shfmt = "3.14.1"
yq = "4.53.6"

[tasks."orb:inspect"]
description = "Inspect the configured OrbStack machine without changing it"
run = "orb info firmament --format json"

[tasks."orb:test"]
description = "Test the vm-orb module without a live VM"
run = "bats modules/vm-orb/tests/unit.bats"

[tasks."ubuntu:test"]
description = "Test the os-ubuntu module without a live host"
run = "bats modules/os-ubuntu/tests/unit.bats"

[tasks."k0s:test"]
description = "Test the orch-k0s module without a live host"
run = "bats modules/orch-k0s/tests/unit.bats"

[tasks."cilium:test"]
description = "Test the cni-cilium module without a live cluster"
run = "bats modules/cni-cilium/tests/unit.bats"

[tasks."tasks:test"]
description = "Test the shared task library with stubbed tools"
run = "bats .mise/tests/lib.bats"

[tasks.test]
description = "Run every offline test suite; never touches infrastructure"
depends = ["*:test"]

[tasks.lint]
description = "Check formatting and lint every file hk covers, without changing anything"
run = "hk check --all"

[tasks.format]
description = "Format every file hk covers"
run = "hk fix --all"

[tasks."shell:lint"]
description = "Lint every shell script with shellcheck"
run = "hk check --all --step shellcheck"

[tasks."shell:format"]
description = "Format every shell script and bats file with shfmt"
run = "hk fix --all --step shfmt"

[tasks."tofu:format"]
description = "Format every OpenTofu file"
run = "hk fix --all --step tofu"

[tasks.check]
description = "Run every offline check: lint, validate, tests and the task definitions"
run = [
  { task = "lint" },
  { task = "tofu:validate" },
  { task = "test" },
  "mise tasks validate",
]
