[settings]
lockfile = true

[hooks]
postinstall = "mise run repo:setup"

[env]
FIRMAMENT_STATE_HOME = "{% if env.FIRMAMENT_STATE_HOME %}{{ env.FIRMAMENT_STATE_HOME }}{% elif env.XDG_STATE_HOME %}{{ env.XDG_STATE_HOME }}/firmament{% else %}{{ env.HOME }}/.local/state/firmament{% endif %}"
# Default cluster at the repository root; each environment/<env>/mise.toml
# points KUBECONFIG at its own cluster.
KUBECONFIG = "{{ env.FIRMAMENT_STATE_HOME }}/environment/local/admin.kubeconfig"

[tools]
"aqua:kyverno/chainsaw" = "0.2.15"
bats = "1.14.0"
cilium-cli = "0.20.0"
cilium-hubble = "1.19.4"
flux2 = "2.9.5"
"github:fluxcd/flux-schema" = "0.13.0"
hk = "2.0.1"
jq = "1.8.2"
kubectl = "1.36.4"
opentofu = "1.12.6"
shellcheck = "0.11.0"
shfmt = "3.14.1"
yq = "4.53.6"

[tasks.check]
description = "Run every offline check: lint, validate and test"
run = [{ task = "lint" }, { task = "tofu:validate" }, { task = "test" }]

[tasks.format]
description = "Run every *:format task"
depends = ["*:format"]

[tasks."k0s:test"]
description = "Check that the orch-k0s module requires its inputs, without a live host"
run = "bats modules/orch-k0s/tests/inputs.bats"

[tasks.lint]
description = "Run every *:lint task; changes nothing"
depends = ["*:lint"]

[tasks."mise:format"]
description = "Format mise.toml"
run = "hk fix --all --step mise"

[tasks."mise:lint"]
description = "Check mise.toml formatting and validate every task definition"
run = ["hk check --all --step mise", "mise tasks validate"]

[tasks."orb:test"]
description = "Test the vm-orb module without a live VM"
run = "bats modules/vm-orb/tests/unit.bats"

[tasks."shell:format"]
description = "Format every shell script and bats file with shfmt"
run = "hk fix --all --step shfmt"

[tasks."shell:lint"]
description = "Lint every shell script with shellcheck and check its shfmt formatting"
run = "hk check --all --step shellcheck --step shfmt"

[tasks."tasks:test"]
description = "Test the task scripts and their shared library with stubbed tools"
run = "bats .mise/tests"

[tasks.test]
description = "Run every *:test task; never touches infrastructure"
depends = ["*:test"]

[tasks."tofu:format"]
description = "Format every OpenTofu file"
run = "hk fix --all --step tofu"

[tasks."tofu:lint"]
description = "Check the formatting of every OpenTofu file"
run = "hk check --all --step tofu"

[tasks."ubuntu:test"]
description = "Test the os-ubuntu module without a live host"
run = "bats modules/os-ubuntu/tests/unit.bats"
