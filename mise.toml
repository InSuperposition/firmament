[settings]
lockfile = true

[env]
KUBECONFIG = "{{ get_env(name='FIRMAMENT_K0S_STATE_DIRECTORY', default=get_env(name='XDG_STATE_HOME', default=env.HOME ~ '/.local/state') ~ '/firmament/targets/firmament/k0s') }}/admin.kubeconfig"

[tools]
bats = "1.14.0"
hk = "2.0.1"
jq = "1.8.2"
kubectl = "1.36.4"
opentofu = "1.12.6"
shellcheck = "0.11.0"
shfmt = "3.14.1"
yq = "4.53.6"

[tasks."orb:inspect"]
description = "Inspect the configured OrbStack machine without changing it"
run = 'orb info "$(jq -er .name bootstrap/orb/machine.json)" --format json'

[tasks."bootstrap:orb"]
description = "Create or validate the dedicated OrbStack machine"
run = 'bash "bootstrap/orb/scripts/bootstrap:orb.sh"'

[tasks."bootstrap:ubuntu"]
description = "Verify the selected Ubuntu host before k0s provisioning"
run = 'bash "bootstrap/ubuntu/scripts/bootstrap:ubuntu.sh"'

[tasks."k0s:init"]
description = "Initialize the k0s OpenTofu backend against the local state directory"
run = '''
dir="${FIRMAMENT_K0S_STATE_DIRECTORY:-${XDG_STATE_HOME:-$HOME/.local/state}/firmament/targets/firmament/k0s}"
mkdir -p "$dir"
tofu -chdir=bootstrap/k0s init -input=false -reconfigure -backend-config="path=$dir/terraform.tfstate"
'''

[tasks."k0s:dry-run"]
description = "Plan the k0sctl_config resource against the selected host"
depends = ["k0s:init"]
run = '''
dir="${FIRMAMENT_K0S_STATE_DIRECTORY:-${XDG_STATE_HOME:-$HOME/.local/state}/firmament/targets/firmament/k0s}"
export TF_VAR_ssh_address="$FIRMAMENT_K0S_SSH_ADDRESS" TF_VAR_ssh_user="$FIRMAMENT_K0S_SSH_USER" TF_VAR_ssh_port="$FIRMAMENT_K0S_SSH_PORT" TF_VAR_ssh_key_path="$FIRMAMENT_K0S_SSH_KEY" TF_VAR_api_address="$FIRMAMENT_K0S_API_ADDRESS" TF_VAR_state_directory="$dir"
tofu -chdir=bootstrap/k0s plan -input=false
'''

[tasks."k0s:apply"]
description = "Apply the k0sctl_config resource and retrieve kubeconfig"
depends = ["k0s:init"]
run = '''
dir="${FIRMAMENT_K0S_STATE_DIRECTORY:-${XDG_STATE_HOME:-$HOME/.local/state}/firmament/targets/firmament/k0s}"
export TF_VAR_ssh_address="$FIRMAMENT_K0S_SSH_ADDRESS" TF_VAR_ssh_user="$FIRMAMENT_K0S_SSH_USER" TF_VAR_ssh_port="$FIRMAMENT_K0S_SSH_PORT" TF_VAR_ssh_key_path="$FIRMAMENT_K0S_SSH_KEY" TF_VAR_api_address="$FIRMAMENT_K0S_API_ADDRESS" TF_VAR_state_directory="$dir"
tofu -chdir=bootstrap/k0s apply -input=false -auto-approve
kubectl --kubeconfig "$dir/admin.kubeconfig" get nodes --request-timeout=30s
'''

[tasks."k0s:test"]
description = "Check the nodes in the applied k0s cluster"
run = 'state="${FIRMAMENT_K0S_STATE_DIRECTORY:-${XDG_STATE_HOME:-$HOME/.local/state}/firmament/targets/firmament/k0s}"; kubectl --kubeconfig "${FIRMAMENT_K0S_KUBECONFIG:-$state/admin.kubeconfig}" get nodes --request-timeout=30s'

[tasks."bootstrap:k0s"]
description = "Verify Ubuntu, dry-run, and apply the first k0s cluster"
run = [
  { task = "bootstrap:ubuntu" },
  { task = "k0s:dry-run" },
  { task = "k0s:apply" },
]

[tasks."orb:adopt"]
description = "Explicitly adopt the validated existing OrbStack machine"
run = 'bash "bootstrap/orb/scripts/orb:adopt.sh"'

[tasks."orb:shellcheck"]
description = "Check OrbStack shell scripts"
run = "shellcheck bootstrap/orb/scripts/*.sh bootstrap/orb/tests/fixtures/orb"

[tasks."orb:lint"]
description = "Check OrbStack scripts and machine configuration"
run = [
  { task = "orb:shellcheck" },
  "shfmt -d -i 2 bootstrap/orb/scripts/*.sh bootstrap/orb/tests/setup.bash bootstrap/orb/tests/fixtures/orb",
  "shfmt -d -i 2 -ln bats bootstrap/orb/tests/*.bats",
  "jq -e -L bootstrap/orb 'include \"machine-schema\"; valid_target' bootstrap/orb/machine.json",
]

[tasks."orb:test"]
description = "Test OrbStack creation and adoption without a live VM"
run = "bats bootstrap/orb/tests/*.bats"

[tasks."check:shellcheck"]
description = "Check all repository shell scripts"
run = "shellcheck bootstrap/orb/scripts/*.sh bootstrap/orb/tests/fixtures/orb bootstrap/ubuntu/scripts/*.sh bootstrap/ubuntu/tests/fixtures/ssh"

[tasks."k0s:fmt"]
description = "Check k0s OpenTofu formatting"
run = "tofu -chdir=bootstrap/k0s fmt -check -recursive"

[tasks."k0s:validate"]
description = "Validate the k0s OpenTofu configuration"
run = '''
tofu -chdir=bootstrap/k0s init -backend=false -input=false -reconfigure >/dev/null
tofu -chdir=bootstrap/k0s validate
'''

[tasks."check:bats"]
description = "Run all repository shell tests"
run = "bats bootstrap/orb/tests/*.bats bootstrap/ubuntu/tests/*.bats bootstrap/k0s/tests/*.bats"

[tasks.check]
description = "Run all off-cluster checks"
run = [
  { task = "orb:lint" },
  "shellcheck bootstrap/ubuntu/scripts/*.sh",
  "shfmt -d -i 2 bootstrap/ubuntu/scripts/*.sh bootstrap/ubuntu/tests/setup.bash bootstrap/ubuntu/tests/fixtures/ssh",
  "shfmt -d -i 2 -ln bats bootstrap/ubuntu/tests/*.bats",
  { task = "check:shellcheck" },
  "shfmt -d -i 2 bootstrap/k0s/tests/setup.bash",
  "shfmt -d -i 2 -ln bats bootstrap/k0s/tests/*.bats",
  { task = "k0s:fmt" },
  { task = "k0s:validate" },
  { task = "check:bats" },
]

[tasks."hooks:install"]
description = "Install repository Git hooks through mise"
run = "hk install --mise"
