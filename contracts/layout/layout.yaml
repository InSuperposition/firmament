# The repository layout: each top-level folder, what it may contain and
# reference, and the patterns the layout lint (mise run layout:lint) checks.
folders:
  contracts:
    holds: data and prose
    may_reference: []
  packages:
    holds: data, plus the package's tests and sourced helper libraries in lib/
    may_reference: [contracts]
  engines:
    holds: delivery adapter code
    may_reference: [contracts, packages]
  orchestrators:
    holds: Kubernetes install adapter code
    may_reference: [contracts]
  modules:
    holds: OpenTofu code
    may_reference: [contracts]
  roots:
    holds: OpenTofu code that reads cluster and environment data
    may_reference: [contracts, modules, clusters, environments]
  clusters:
    holds: data
    may_reference: [contracts, packages]
  environments:
    holds: data and declarative test suites
    may_reference: [clusters, roots]

# A package folder name is <layer>-<tool>. A .mise/tasks/<x>/ folder whose
# name has this shape must have a matching packages/<x>/.
package_pattern: "^[a-z][a-z0-9]*-[a-z0-9][a-z0-9-]*$"

# Files with these extensions are code; so is any executable file.
code_extensions: [tf, hcl, sh, bash, bats, py, go, js, ts, lua]

# Data files the name and fact rules read.
data_extensions: [yaml, yml, json, cue]

# The only places a cluster name may appear. Renaming a cluster means
# changing exactly these; see README.md.
cluster_name_places:
  - description: the cluster folder
    path: clusters/<cluster>/
  - description: the cluster's entry in each environment
    path: environments/<env>/environment.yaml
  - description: the cluster's tenant file
    path: environments/<env>/tenants/<cluster>.yaml
  - description: the cluster's delta folder
    path: environments/<env>/deltas/<cluster>/
  - description: the machine name
    value: <env>-<cluster>
  - description: the mesh cluster name, from the environment fact cluster_name
    value: <cluster>
  - description: the OpenBao auth mount and object names
    value: auth/k8s/<cluster>, k8s-<cluster>-<component>
  - description: the zot client certificate CN and repository prefix
    value: remote-<cluster>, tenants/<cluster>/

# Literal environment facts that may not appear in packages/ or clusters/.
fact_patterns:
  - name: IPv4 address or CIDR
    regex: '(^|[^0-9.])([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?([^0-9.]|$)'
  - name: size
    regex: '[^A-Za-z0-9_][0-9]+ ?(Ki|Mi|Gi|Ti|KiB|MiB|GiB|TiB|MB|GB|TB)([^A-Za-z]|$)'

# Values that match a fact pattern but are not environment facts.
fact_allow: ["0.0.0.0", "127.0.0.1"]

# Paths that break a rule today, each with the items that remove it. An
# exception whose paths match no file fails the lint, so it cannot outlive
# the code it covers.
exceptions:
  - rule: environments-no-code
    paths:
      - environments/local/*.tf
      - environments/local/.terraform.lock.hcl
      - environments/local/bootstrap/*
      - environments/local/bootstrap/.terraform.lock.hcl
      - environments/local/tests/inputs.tftest.hcl
      - environments/local/tests/integration.bats
      - environments/local/tests/setup.bash
    owners: [machines-orbstack, orchestrator-k0sctl, engine-flux]
    reason: today's OpenTofu root for the local environment, replaced by roots/ and the orb and k0sctl tasks

# Which contract each data file must satisfy; mise run contracts:lint
# validates every file a glob matches against the definition. Each
# contract's samples/ holds one valid file per definition.
contract_files:
  - {glob: "packages/*/package.yaml", contract: package-spec, definition: "#Package"}
  - {glob: "clusters/*/cluster.yaml", contract: cluster-spec, definition: "#Cluster"}
  - {glob: "clusters/*/packages.yaml", contract: cluster-spec, definition: "#Packages"}
  - {glob: "environments/*/environment.yaml", contract: environment-spec, definition: "#Environment"}
  - {glob: "environments/*/tenants/*.yaml", contract: environment-spec, definition: "#Tenant"}
  - {glob: "environments/*/deltas/*/*.yaml", contract: environment-spec, definition: "#Delta"}
  - {glob: "contracts/package-spec/samples/package.yaml", contract: package-spec, definition: "#Package"}
  - {glob: "contracts/cluster-spec/samples/cluster.yaml", contract: cluster-spec, definition: "#Cluster"}
  - {glob: "contracts/cluster-spec/samples/packages.yaml", contract: cluster-spec, definition: "#Packages"}
  - {glob: "contracts/environment-spec/samples/environment.yaml", contract: environment-spec, definition: "#Environment"}
  - {glob: "contracts/environment-spec/samples/tenant.yaml", contract: environment-spec, definition: "#Tenant"}
  - {glob: "contracts/environment-spec/samples/delta.yaml", contract: environment-spec, definition: "#Delta"}
  - {glob: "contracts/environment-facts/samples/facts.yaml", contract: environment-facts, definition: "#Facts"}
  - {glob: "contracts/machine-hosts/samples/machine-hosts.yaml", contract: machine-hosts, definition: "#MachineHosts"}
  - {glob: "contracts/cluster-access/samples/cluster-access.yaml", contract: cluster-access, definition: "#ClusterAccess"}
  - {glob: "contracts/private-state/samples/private-state.yaml", contract: private-state, definition: "#PrivateState"}
