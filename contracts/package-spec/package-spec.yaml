name: openbao
layer: identity
pin:
  source: oci://ghcr.io/openbao/charts/openbao
  version: 0.18.0
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
bootstrap: false
verify:
  issuer: ^https://token\.actions\.githubusercontent\.com$
  identity: ^https://github\.com/example/charts/\.github/workflows/publish\.yaml@refs/tags/.+$
delta_keys:
  - server.replicas
requires:
  - capability: storage
    scope: cluster
provides:
  - capability: secrets
    scope: cluster
    port: 8443
    protocol: TCP
    readiness:
      kind: StatefulSet
      name: openbao
host_ports:
  - port: 8443
    protocol: TCP
